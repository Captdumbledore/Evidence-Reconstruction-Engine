<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RECONSTRUCT | Secure Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #090304;
      --bg-secondary: #14090b;
      --bg-tertiary: #1f0e11;
      --border-color: #3b161b;
      --text-main: #fcf0f2;
      --text-muted: #a3828a;
      --accent-red: #ff2a4b;
      --accent-red-hover: #ff4d6d;
      --accent-crimson: #dc2626;
      --accent-green: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, rgba(255, 42, 75, 0.25), rgba(185, 28, 28, 0.1));
      border: 1px solid var(--accent-red);
      border-radius: 12px;
      margin-bottom: 1rem;
      box-shadow: 0 0 20px rgba(255, 42, 75, 0.25);
    }

    .brand-logo svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: var(--accent-red);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .brand-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--text-main);
    }

    .brand-subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .auth-card {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-main);
      margin-bottom: 0.5rem;
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent-red);
      box-shadow: 0 0 0 3px rgba(255, 42, 75, 0.2);
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.8rem;
      padding: 4px;
    }

    .toggle-password:hover {
      color: var(--text-main);
    }

    .flex-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .checkbox-group input {
      accent-color: var(--accent-red);
      width: 16px;
      height: 16px;
    }

    .checkbox-label {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .link-action {
      font-size: 0.85rem;
      color: var(--accent-red);
      text-decoration: none;
      transition: color 0.2s;
    }

    .link-action:hover {
      text-decoration: underline;
      color: var(--accent-red-hover);
    }

    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background: linear-gradient(135deg, var(--accent-red), var(--accent-crimson));
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(255, 42, 75, 0.3);
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, var(--accent-red-hover), var(--accent-red));
      box-shadow: 0 4px 20px rgba(255, 42, 75, 0.45);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 1.5rem 0;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }

    .divider span {
      padding: 0 0.75rem;
    }

    .sso-options {
      display: flex;
      gap: 0.75rem;
    }

    .btn-sso {
      flex: 1;
      padding: 0.65rem;
      background-color: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background-color 0.2s, border-color 0.2s;
    }

    .btn-sso:hover {
      background-color: var(--border-color);
      border-color: var(--accent-red);
    }

    .card-footer {
      text-align: center;
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border-color);
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: none;
    }

    .alert-error {
      background-color: rgba(255, 42, 75, 0.15);
      border: 1px solid var(--accent-red);
      color: #ff7b8e;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="brand-header">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
        </svg>
      </div>
      <h1 class="brand-title">RECONSTRUCT</h1>
      <p class="brand-subtitle">Evidence Recreation Engine & Investigation Platform</p>
    </div>

    <div class="auth-card">
      <h2 class="card-title">Sign In</h2>

      <div id="alertBox" class="alert alert-error">
        Invalid credentials provided. Please check your credentials and try again.
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="username">Badge ID or Work Email</label>
          <input type="text" id="username" class="form-input" placeholder="e.g. inv-8042@agency.gov" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" class="form-input" placeholder="••••••••••••" required>
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password')">Show</button>
          </div>
        </div>

        <div class="flex-row">
          <label class="checkbox-group">
            <input type="checkbox" id="rememberMe">
            <span class="checkbox-label">Remember device</span>
          </label>
          <a href="forgot-password.html" class="link-action">Forgot password?</a>
        </div>

        <button type="submit" class="btn-submit">Sign In</button>
      </form>

      <div class="divider">
        <span>OR AUTHENTICATE WITH</span>
      </div>

      <div class="sso-options">
        <button class="btn-sso" onclick="location.href='two-factor.html'">
          🛡️ PIV / CAC Card
        </button>
        <button class="btn-sso" onclick="location.href='two-factor.html'">
          🔑 Security Key
        </button>
      </div>

      <div class="card-footer">
        Need system access? <a href="register.html" class="link-action">Request Account</a>
      </div>
    </div>
  </div>

  <script>
    function togglePasswordVisibility(fieldId) {
      const field = document.getElementById(fieldId);
      const btn = field.nextElementSibling;
      if (field.type === 'password') {
        field.type = 'text';
        btn.textContent = 'Hide';
      } else {
        field.type = 'password';
        btn.textContent = 'Show';
      }
    }

    function handleLogin(event) {
      event.preventDefault();
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;

      if (user && pass) {
        window.location.href = 'two-factor.html';
      } else {
        document.getElementById('alertBox').style.display = 'block';
      }
    }
  </script>
</body>
</html>
